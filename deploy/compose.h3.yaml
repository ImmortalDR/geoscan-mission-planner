x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: '5m'
    max-file: '2'
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    entrypoint: ['sh', '/bootstrap/postgres-tls.sh']
    command: ['postgres', '-c', 'ssl=on', '-c', 'ssl_cert_file=/var/lib/postgresql/tls/server.crt', '-c', 'ssl_key_file=/var/lib/postgresql/tls/server.key', '-c', 'password_encryption=scram-sha-256']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: geoscan
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    secrets: [db_password, db_admin_password, db_key, db_ca]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-tls.sh:/bootstrap/postgres-tls.sh:ro
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-geoscan.sh:ro
    networks: [backend]
    logging: *bounded-logging
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U geoscan -d geoscan']
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GMP_DATABASE_URL_FILE: /run/secrets/database_url
      GMP_AUTH_FILE: /run/secrets/users
      GMP_DEPLOYMENT_MODE: internal
      GMP_OFFLINE: '1'
      GMP_PUBLIC_ORIGIN: ${GMP_PUBLIC_ORIGIN:?Set the HTTPS origin}
      GMP_LOG_LIMIT_BYTES: '450000000'
    secrets: [database_url, users, db_ca]
    volumes:
      - h3-data:/var/lib/geoscan-h3
    networks: [backend]
    expose: ['8090']
    mem_limit: ${GMP_MEMORY_LIMIT:-4g}
    cpus: ${GMP_CPU_LIMIT:-2}
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *bounded-logging
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports: ['${GMP_HTTPS_BIND:-443}:443']
    networks: [backend, frontend]
    volumes:
      - ./nginx-container.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:?Set certificate path}:/etc/h3/fullchain.pem:ro
      - ${TLS_KEY_FILE:?Set private key path}:/etc/h3/privkey.pem:ro
    logging: *bounded-logging
secrets:
  db_admin_password:
    file: ${DB_ADMIN_PASSWORD_FILE:?Set database administrator password file}
  db_password:
    file: ${DB_PASSWORD_FILE:?Set database password file}
  db_key:
    file: ${DB_KEY_FILE:?Set database private key file}
  db_ca:
    file: ${DB_CERT_FILE:?Set database certificate file}
  database_url:
    file: ${GMP_DATABASE_URL_HOST:?Set database URL secret file}
  users:
    file: ${GMP_AUTH_FILE_HOST:?Set users file}
networks:
  backend:
    internal: true
  frontend: {}
volumes:
  pg-data:
  h3-data:
