server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include /etc/nginx/snippets/geoscan-h3-acme.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/geoscan-h3-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geoscan-h3-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GeoscanMVPTLS:10m;
    client_max_body_size 101m;
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/geoscan-h3-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geoscan-h3-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://$host$request_uri;
}
