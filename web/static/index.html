<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Geoscan Mission Planner</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    :root { --bg:#0f1419; --panel:#171e26; --line:#2a3542; --text:#e8eef4; --muted:#8ea0b3; --acc:#3d8bfd; --ok:#3dba7a; --bad:#e05757; --warn:#d39b3a; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI",system-ui,sans-serif; }
    header { display:flex; align-items:center; gap:16px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
    header h1 { font-size:15px; font-weight:600; margin:0; letter-spacing:.02em; }
    header .meta { color:var(--muted); font-size:12px; }
    nav { display:flex; gap:4px; margin-left:auto; }
    nav button { background:transparent; color:var(--muted); border:1px solid transparent; padding:6px 10px; cursor:pointer; border-radius:4px; }
    nav button.active { color:var(--text); border-color:var(--line); background:#1f2832; }
    .layout { display:grid; grid-template-columns: 340px 1fr; height:calc(100% - 52px); }
    aside { border-right:1px solid var(--line); padding:12px; overflow:auto; background:var(--panel); }
    main { position:relative; overflow:hidden; }
    #map { position:absolute; inset:0; }
    .screen { display:none; position:absolute; inset:0; overflow:auto; padding:16px; }
    .screen.active { display:block; }
    #result.screen.active, #scenario.screen.active { display:block; padding:0; }
    label { display:block; color:var(--muted); font-size:12px; margin:8px 0 4px; }
    select,input,textarea,button.primary { width:100%; padding:8px; background:#10161c; color:var(--text); border:1px solid var(--line); border-radius:4px; }
    button.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; cursor:pointer; margin-top:12px; }
    button.primary:disabled { opacity:.5; cursor:wait; }
    .stat { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); }
    .stat b { font-weight:600; }
    .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th,td { border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
    th { background:#1f2832; }
    .log { font:12px/1.4 ui-monospace,monospace; background:#10161c; padding:8px; min-height:120px; white-space:pre-wrap; }
    .card { background:var(--panel); border:1px solid var(--line); padding:12px; margin-bottom:12px; }
    a { color:var(--acc); }
    .overlay-panel { position:absolute; right:12px; top:12px; width:320px; max-height:calc(100% - 24px); overflow:auto; background:rgba(23,30,38,.94); border:1px solid var(--line); padding:12px; z-index:2; }
  </style>
</head>
<body>
<header>
  <h1>Geoscan Mission Planner</h1>
  <div class="meta">предполётное планирование группы БВС · ТЗ v4</div>
  <nav id="nav"></nav>
</header>
<div class="layout">
  <aside id="side"></aside>
  <main>
    <section class="screen active" id="scenario"><div id="map"></div><div class="overlay-panel" id="sceneInfo">Загрузите сценарий слева.</div></section>
    <section class="screen" id="optimize"><div class="card"><h3>Ход оптимизации</h3><div class="log" id="optLog">ожидание запуска…</div></div></section>
    <section class="screen" id="result"><div id="map2" style="position:absolute;inset:0"></div></section>
    <section class="screen" id="timeline"></section>
    <section class="screen" id="safety"></section>
    <section class="screen" id="recs"></section>
    <section class="screen" id="export"></section>
  </main>
</div>
<script>
const SCREENS = [
  ["scenario","Сценарий"],["optimize","Optimize"],["result","Результат"],
  ["timeline","Timeline"],["safety","Safety"],["recs","Рекомендации"],["export","Экспорт"]
];
const state = { scene:null, planId:null, plan:null, timer:null };
const nav = document.getElementById("nav");
SCREENS.forEach(([id,label],i)=>{
  const b=document.createElement("button"); b.textContent=label; if(i===0) b.className="active";
  b.onclick=()=>show(id,b); nav.appendChild(b);
});
function show(id,btn){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  nav.querySelectorAll("button").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  if(id==="result" && state.plan) drawPlan();
  if(id==="timeline") renderTimeline();
  if(id==="safety") renderSafety();
  if(id==="recs") renderRecs();
  if(id==="export") renderExport();
}
const side = document.getElementById("side");
side.innerHTML = `
  <label>Готовый сценарий S00–S11</label>
  <select id="scenarioSel"></select>
  <button class="primary" id="loadBtn">Загрузить сцену</button>
  <label>Критерий</label>
  <select id="obj"><option value="makespan">minimum completion time / makespan</option><option value="total_flight">minimum total flight</option></select>
  <label>Time budget, с</label>
  <input id="budget" type="number" value="40"/>
  <button class="primary" id="runBtn" disabled>Optimize</button>
  <div id="sideStats"></div>
`;
const map = new maplibregl.Map({
  container:"map",
  style:{version:8,sources:{osm:{type:"raster",tiles:["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],tileSize:256}},layers:[{id:"osm",type:"raster",source:"osm"}]},
  center:[37.62,55.75], zoom:11
});
let map2=null;
fetch("/api/v1/scenarios").then(r=>r.json()).then(d=>{
  const sel=document.getElementById("scenarioSel");
  d.scenarios.forEach(s=>{
    const o=document.createElement("option"); o.value=s.id; o.textContent=s.id; sel.appendChild(o);
  });
});
document.getElementById("loadBtn").onclick=async()=>{
  const sid=document.getElementById("scenarioSel").value;
  const res=await fetch("/api/v1/scenes?scenario_id="+encodeURIComponent(sid),{method:"POST"});
  const rec=await res.json();
  const full=await fetch("/api/v1/scenes/"+rec.id).then(r=>r.json());
  state.scene=full;
  document.getElementById("runBtn").disabled=false;
  document.getElementById("obj").value=full.objective||"makespan";
  document.getElementById("sceneInfo").innerHTML = renderSceneCard(full);
  paintScene(map, full.geojson);
};
document.getElementById("runBtn").onclick=async()=>{
  if(!state.scene) return;
  const body={scene_id:state.scene.id, objective:document.getElementById("obj").value, time_budget_s:Number(document.getElementById("budget").value)};
  const rec=await fetch("/api/v1/plans",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json());
  state.planId=rec.id;
  document.getElementById("optLog").textContent="job "+rec.id+" queued\n";
  show("optimize", nav.children[1]);
  poll();
};
function poll(){
  clearInterval(state.timer);
  state.timer=setInterval(async()=>{
    const st=await fetch("/api/v1/plans/"+state.planId+"/status").then(r=>r.json());
    const log=(st.progress||[]).map(e=> (e.t_s??"")+"  "+(e.stage||JSON.stringify(e))).join("\n");
    document.getElementById("optLog").textContent=log||JSON.stringify(st);
    if(["SAFE","UNSAFE","INFEASIBLE","ERROR"].includes(st.status)){
      clearInterval(state.timer);
      state.plan=await fetch("/api/v1/plans/"+state.planId).then(r=>r.json());
      document.getElementById("sideStats").innerHTML=renderMetrics(state.plan);
      show("result", nav.children[2]);
      drawPlan();
    }
  },1000);
}
function renderSceneCard(s){
  const jobs=(s.jobs||[]).map(j=>`<div class="stat"><span>${j.id} · ${j.survey_type}</span><b>${j.area_km2} км²</b></div>`).join("");
  const fleet=(s.fleet||[]).map(u=>`<div class="stat"><span>${u.id}</span><b>${u.model}</b></div>`).join("");
  const warn=(s.validation&&s.validation.issues||[]).map(i=>`<div class="warn">${i.code}: ${i.message}</div>`).join("");
  return `<h3>${s.id}</h3>${jobs}<h4>Парк</h4>${fleet}${warn||'<div class="ok">сцена валидна</div>'}`;
}
function renderMetrics(p){
  const m=p.metrics||{};
  const cls=p.status==="SAFE"?"ok":(p.status==="INFEASIBLE"?"warn":"bad");
  return `<div class="stat"><span>статус</span><b class="${cls}">${p.status}</b></div>
    <div class="stat"><span>покрытие</span><b>${m.coverage_percent??"—"} %</b></div>
    <div class="stat"><span>makespan</span><b>${m.makespan_min??"—"} мин</b></div>
    <div class="stat"><span>налёт</span><b>${m.total_flight_min??"—"} мин</b></div>
    <div class="stat"><span>вылеты / БВС</span><b>${m.sortie_count??"—"} / ${m.used_uav_count??"—"}</b></div>`;
}
function paintScene(m, fc){
  if(!fc) return;
  if(m.getSource("scene")) { m.getSource("scene").setData(fc); }
  else {
    m.addSource("scene",{type:"geojson",data:fc});
    m.addLayer({id:"allowed",type:"fill",source:"scene",filter:["==",["get","layer"],"allowed"],paint:{"fill-color":"#3d8bfd","fill-opacity":0.08}});
    m.addLayer({id:"survey",type:"fill",source:"scene",filter:["==",["get","layer"],"survey"],paint:{"fill-color":"#3dba7a","fill-opacity":0.25,"fill-outline-color":"#3dba7a"}});
    m.addLayer({id:"nfz",type:"fill",source:"scene",filter:["==",["get","layer"],"nfz"],paint:{"fill-color":"#e05757","fill-opacity":0.35}});
    m.addLayer({id:"sites",type:"circle",source:"scene",filter:["==",["get","layer"],"site"],paint:{"circle-radius":6,"circle-color":"#d39b3a"}});
  }
  const pts=(fc.features||[]).filter(f=>f.geometry&&f.geometry.type==="Point");
  if(pts[0]) m.flyTo({center:pts[0].geometry.coordinates, zoom:12});
}
function ensureMap2(){
  if(map2) return map2;
  map2=new maplibregl.Map({container:"map2", style:map.getStyle(), center:map.getCenter(), zoom:map.getZoom()});
  return map2;
}
async function drawPlan(){
  const m=ensureMap2();
  if(state.scene&&state.scene.geojson){
    if(m.loaded()) paintScene(m,state.scene.geojson); else m.on("load",()=>paintScene(m,state.scene.geojson));
  }
  const gj=await fetch("/api/v1/plans/"+state.planId+"/export?format=geojson").then(r=>r.json());
  const apply=()=>{
    if(m.getSource("plan")) m.getSource("plan").setData(gj);
    else {
      m.addSource("plan",{type:"geojson",data:gj});
      m.addLayer({id:"routes",type:"line",source:"plan",filter:["==",["get","layer"],"sortie"],paint:{"line-color":"#3d8bfd","line-width":3}});
    }
  };
  if(m.loaded()) apply(); else m.on("load", apply);
}
function renderTimeline(){
  const el=document.getElementById("timeline");
  const sorties=(state.plan&&state.plan.plan&&state.plan.plan.sorties)||[];
  if(!sorties.length){ el.innerHTML="<p>Нет расписания.</p>"; return; }
  const rows=sorties.map(s=>`<tr><td>${s.uav_id}</td><td>${s.id}</td><td>${s.start_site}</td><td>${s.landing_site}</td><td>${s.t_start||""}</td><td>${s.t_end||""}</td><td>${(s.task_ids||[]).join(", ")}</td></tr>`).join("");
  el.innerHTML=`<div class="card"><h3>Gantt / расписание вылетов</h3><table><tr><th>БВС</th><th>Вылет</th><th>Старт</th><th>Посадка</th><th>t0</th><th>t1</th><th>Задачи</th></tr>${rows}</table></div>`;
}
function renderSafety(){
  const el=document.getElementById("safety");
  const v=state.plan&&state.plan.validation||{};
  const c=state.plan&&state.plan.certificate;
  const counters=v.counters||{};
  const rows=Object.entries(counters).map(([k,val])=>`<tr><td>${k}</td><td class="${val===0?"ok":"bad"}">${val}</td></tr>`).join("");
  el.innerHTML=`<div class="card"><h3>Safety Certificate</h3>
    <p>Статус: <b class="${state.plan&&state.plan.status==="SAFE"?"ok":"bad"}">${state.plan&&state.plan.status}</b>
    ${c?" · fingerprint "+c.fingerprint_sha256: " · сертификат не выдан"}</p>
    <table><tr><th>Проверка</th><th>Нарушения</th></tr>${rows}</table>
    <pre class="log">${JSON.stringify(c||{note:"нет сертификата"},null,2)}</pre></div>`;
}
function renderRecs(){
  const el=document.getElementById("recs");
  fetch("/api/v1/plans/"+state.planId+"/recommendations").then(r=>r.json()).then(d=>{
    const recs=d.recommendations||[];
    const diag=d.diagnosis||{};
    el.innerHTML=`<div class="card"><h3>Диагноз</h3><p>${(diag.reason_codes||[]).join(", ")||"—"}</p></div>`+
      recs.map(r=>`<div class="card"><h3>${r.rank}. ${r.title} ${r.verified?'<span class="ok">verified</span>':'<span class="warn">unverified</span>'}</h3><p>${r.description||""}</p><pre class="log">${JSON.stringify(r.verification,null,2)}</pre></div>`).join("")
      || "<p>Рекомендации не требуются.</p>";
  });
}
function renderExport(){
  const id=state.planId;
  const el=document.getElementById("export");
  el.innerHTML=`<div class="card"><h3>Экспорт</h3>
    <p><a href="/api/v1/plans/${id}/export?format=geojson" target="_blank">GeoJSON</a></p>
    <p><a href="/api/v1/plans/${id}/export?format=kml" target="_blank">KML</a></p>
    <p><a href="/api/v1/plans/${id}/export?format=mission" target="_blank">Mission JSON</a></p>
    <p><a href="/api/v1/plans/${id}/export?format=qgc" target="_blank">QGroundControl .plan</a></p>
    <p><a href="/api/v1/plans/${id}/export?format=certificate" target="_blank">Safety Certificate</a></p>
    <p><a href="/docs" target="_blank">OpenAPI</a></p></div>`;
}
</script>
</body>
</html>
