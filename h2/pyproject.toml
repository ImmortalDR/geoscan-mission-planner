[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoscan-h2"
version = "0.1.0"
description = "Contract-driven multi-UAV scheduling and continuous 4D deconfliction"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<2", "scipy>=1.14,<1.16", "ortools>=9.10,<10", "shapely>=2,<3", "pyproj>=3.6,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
terrain = ["rasterio>=1.3,<2"]
estimate = ["numpy>=1.26,<2", "scipy>=1.14,<1.16", "rasterio>=1.3,<2"]

[project.scripts]
h2 = "h2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["benchmark: real dataset regression", "integration: H1 and H3 integration"]
